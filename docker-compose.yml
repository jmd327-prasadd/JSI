services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jqa
      POSTGRES_PASSWORD: jqa
      POSTGRES_DB: jqa
    volumes:
      - jqa_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      JQA_DATABASE_URL: postgresql+psycopg://jqa:jqa@db:5432/jqa
      JQA_DATA_DIR: /data
    volumes:
      - jqa_data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      JQA_DATABASE_URL: postgresql+psycopg://jqa:jqa@db:5432/jqa
      JQA_DATA_DIR: /data
    volumes:
      - jqa_data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  jqa_pgdata:
  jqa_data:
